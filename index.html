<!DOCTYPE html>
<!-- ============================================================================
  SUPER SUBWAY '94 — 16-bit Subway Driver
  ----------------------------------------------------------------------------
  WHAT IS THIS? A complete game in ONE file (HTML + CSS + JavaScript).
  No build step, no libraries. Open index.html in a browser and it runs.
  It is published with GitHub Pages (see .github/workflows/pages.yml).

  HOW TO READ THIS FILE (junior-dev map):
    1. HEAD + STYLE    → page layout, arcade cabinet look, mobile buttons.
    2. BODY            → canvas (#game) + touch buttons + hint text.
    3. SCRIPT section  → the whole game, in order:
         a. Constants    → world sizes, camera numbers (W, H, FOCAL…).
         b. Sprites      → tiny pixel pictures drawn with code (makeBmp).
         c. Audio        → bleeps with WebAudio (beep, chime, engine hum).
         d. Track/state  → stations, speed limits, score, game state.
         e. Input        → keyboard + touch buttons call the same functions.
         f. Projection   → 3D-to-2D math (projectY) so far things look small.
         g. Render       → draws tunnel row-by-row + sprites + dashboard.
         h. Update       → physics + scoring, called ~60x/second.

  KEY IDEA: the "3D" is fake. Each horizontal screen row = one depth (z)
  down the tunnel. Near rows = close (big), horizon rows = far (tiny).
  Sprites are then scaled by s = FOCAL / z. That is the whole trick.
============================================================================= -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SUPER SUBWAY '94 — 16-bit Subway Driver</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0a0a12;height:100%;height:100dvh;overflow:hidden;
    font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  /* Portrait-only full-screen layout: game fills viewport, controls pin to bottom */
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:stretch;
    background:#0a0a12;padding-top:env(safe-area-inset-top,0px);}
  #cab{display:flex;flex-direction:column;flex:1;min-height:0;}
  /* Game screen: grows to fill all height not taken by touch controls */
  #screen{flex:1;min-height:0;width:100%;position:relative;background:#000;
    overflow:hidden;touch-action:none;cursor:pointer;}
  canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated;
    image-rendering:crisp-edges;background:#000;}
  /* CRT scanlines — subtle, every 4px, soft opacity */
  #screen::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px,rgba(0,0,0,0) 3px,rgba(0,0,0,.10) 4px);
    mix-blend-mode:multiply;}
  /* CRT vignette — gentle edge darkening */
  #screen::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.32) 100%);}
  #marquee{display:none;}
  #hint{display:none;}
  /* Touch controls: always visible, safe-area aware */
  #touch{display:flex;flex-direction:column;gap:5px;flex-shrink:0;

    background:#111118;border-top:2px solid #2a2a40;}
  .trow{display:flex;gap:5px;}
  .tbtn{flex:1;min-height:48px;min-width:0;border:2px solid #111;border-radius:6px;
    background:#3d3d5c;color:#fff;font-family:inherit;font-weight:bold;

  .tbtn:active,.tbtn.held{transform:translateY(2px);box-shadow:0 1px 0 #111;filter:brightness(1.25);}
  .tbtn.pwr{background:#14532d;border-color:#0a2e18;}
  .tbtn.brk{background:#6b1a1a;border-color:#3a0d0d;}

  .tbtn.util{background:#26263a;font-size:11px;min-height:42px;}
</style>
</head>
<body>
<!-- Visible page: arcade cabinet > marquee title, game screen, touch pad, hint.
     The canvas is only 320x200 pixels internally — CSS stretches it big. -->
<div id="wrap">
  <div id="cab">
    <div id="screen"><canvas id="game" width="200" height="320"></canvas></div>
    <!-- Touch controls: two rows of big buttons. Hidden on desktop via CSS
         (only shown for coarse pointers / body.touch). IDs are wired in JS. -->
    <div id="touch" aria-label="Touch controls">
      <div class="trow">
        <button class="tbtn pwr" id="btnPwr" type="button">▲ PWR<small>power +1</small></button>

  </div>
</div>
<script>
"use strict";
// Strict mode: catches silent mistakes (undeclared vars, etc.). Good default.
/* ============================================================
   SUPER SUBWAY '94
   First-person subway driver, 16-bit style, scaling bitmaps.
   Technique: scanline pseudo-3D tunnel renderer (like OutRun /
   SNES Mode-7) + nearest-neighbour scaled sprites.
   All art is procedural pixel bitmaps scaled at runtime.
   ------------------------------------------------------------
   GAME LOOP IN ONE SENTENCE:
   update() runs physics/scoring → render() draws everything →
   requestAnimationFrame(update) repeats ~60fps. See bottom file.
   ============================================================ */
// --- World + camera constants (tweak these to change the "feel") ---
// W/H: canvas pixels. HORIZON: screen row where tunnel vanishes.
// COCKPIT_H: bottom HUD height. FOCAL: like camera zoom (bigger = narrower).
// CAM_H: camera height above track. CEIL_H: tunnel roof height.
// TUN_HALF: tunnel half-width in world units. ROOF_TOP: top clip row.
const W = 200, H = 320;
const HORIZON = 95;
const COCKPIT_H = 90;
const FOCAL = 100;
const CAM_H = 14;
const CEIL_H = 40;      // tunnel roof height (world units, camera at CAM_H)
const TUN_HALF = 75;    // tunnel half-width (world units, narrower for portrait)
const ROOF_TOP = 16;    // highest screen row the roof render covers
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- tiny pixel helpers ---------- */
// makeBmp: create a small offscreen canvas and let fn(g,w,h) paint on it.
// We use these as "sprites" — draw once, then stamp scaled copies each frame.
// Example: makeBmp(8,8,(g)=>{g.fillStyle='red';g.fillRect(0,0,8,8);})
function makeBmp(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  fn(g,w,h);return c;
}
// 16-bit-ish palette: one place for all tunnel/track colors so the
// art style stays consistent. Change a hex here to re-theme the game.
const PAL = {
  tunnel0:'#151524', tunnel1:'#1c1c30', brick:'#26263e', brickDark:'#191926',
  rail:'#9aa0b8', railHi:'#e8ecff', sleeper:'#4a3220', sleeper2:'#3a2818',
  floor:'#23232e', floorLine:'#3d3d55', lamp:'#fff2b0', lampGlow:'#ffcf4d',
  plat:'#5a5a6e', platEdge:'#ffe14d', pillarG:'#2e8b57', pillarR:'#b03030'
};

/* ---------- procedural sprites (bitmaps that get SCALED) ---------- */
// No image files! Every lamp, signal, person, bench is painted pixel by
// pixel with fillRect() above, then drawn big/small with drawImage().
// "spr" = sprite. They are tiny on purpose — scaling keeps them chunky.
// ceiling lamp fixture: housing bolted to tunnel ROOF, bulb hangs down
const sprLamp = makeBmp(24,10,(g)=>{
  g.clearRect(0,0,24,10);
  g.fillStyle='#0c0c14';g.fillRect(0,0,24,4);          // housing
  g.fillStyle='#3d3d5c';g.fillRect(0,0,24,1);          // rim light
  g.fillStyle='#5a5a7a';g.fillRect(10,4,4,2);          // mount
  g.fillStyle='#ffcf4d';g.fillRect(8,6,8,3);           // tube
  g.fillStyle='#fff2b0';g.fillRect(10,6,4,1);          // hot spot
  g.fillStyle='rgba(255,242,176,0.4)';g.fillRect(4,5,16,5);
});
// big exit-signal heads (red / green) with glow halo
const sprExitR = makeBmp(12,20,(g)=>{
  g.clearRect(0,0,12,20);
  g.fillStyle='rgba(255,40,40,0.35)';g.fillRect(0,0,12,20);
  g.fillStyle='#111';g.fillRect(2,1,8,18);
  g.fillStyle='#666';g.fillRect(2,1,8,1);
  g.fillStyle='#f22';g.fillRect(3,3,6,6);
  g.fillStyle='#ffb0b0';g.fillRect(4,3,2,2);
  g.fillStyle='#2a0505';g.fillRect(3,11,6,6);
});
const sprExitG = makeBmp(12,20,(g)=>{
  g.clearRect(0,0,12,20);
  g.fillStyle='rgba(40,255,120,0.35)';g.fillRect(0,0,12,20);
  g.fillStyle='#111';g.fillRect(2,1,8,18);
  g.fillStyle='#666';g.fillRect(2,1,8,1);
  g.fillStyle='#3a0a0a';g.fillRect(3,3,6,6);
  g.fillStyle='#0f6';g.fillRect(3,11,6,6);
  g.fillStyle='#8fffb0';g.fillRect(4,11,2,2);
});
const sprSignalG = makeBmp(8,18,(g)=>{
  g.fillStyle='#111';g.fillRect(0,0,8,18);
  g.fillStyle='#222';g.fillRect(1,1,6,16);
  g.fillStyle='#033';g.fillRect(2,2,4,4);
  g.fillStyle='#0f6';g.fillRect(2,11,4,4);
  g.fillStyle='#8fffb0';g.fillRect(3,11,2,1);
});
const sprSignalR = makeBmp(8,18,(g)=>{
  g.fillStyle='#111';g.fillRect(0,0,8,18);
  g.fillStyle='#222';g.fillRect(1,1,6,16);
  g.fillStyle='#f22';g.fillRect(2,2,4,4);
  g.fillStyle='#ffb0b0';g.fillRect(3,2,2,1);
  g.fillStyle='#300';g.fillRect(2,11,4,4);
});
/* Speed-limit signs are cached: speedSignSprite(50) builds the bitmap once,
   then reuses it. Without the cache we'd rebuild text every frame (slow). */
/* max-speed sign per value (yellow board on a post) + sharp-curve warning */
const speedSignCache={};
function speedSignSprite(kmh){
  if(speedSignCache[kmh])return speedSignCache[kmh];
  const c=makeBmp(26,28,(g)=>{
    g.clearRect(0,0,26,28);
    g.fillStyle='#333';g.fillRect(11,12,4,16);          // post
    g.fillStyle='#ffe14d';g.fillRect(0,0,26,16);        // board
    g.fillStyle='#000';g.fillRect(0,0,26,2);g.fillRect(0,14,26,2);
    g.fillRect(0,0,2,16);g.fillRect(24,0,2,16);
    g.fillStyle='#000';g.textBaseline='top';
    const t=String(kmh);
    g.font=t.length>2?'bold 9px monospace':'bold 11px monospace';
    g.fillText(t,t.length>2?1:5,3);
  });
  speedSignCache[kmh]=c;return c;
}
/* Green motivational signs — short quotes on green boards with white text */
const MSG_QUOTES=['GOOD DRIVING','HAVE A NICE DAY','GREAT WORK','SMOOTH RIDE',
  'MIND THE GAP','ENJOY THE RIDE','STAY ON TIME','NICE AND STEADY',
  'KEEP IT UP','SAFE TRAVELS','NEXT STOP SOON','WATCH THE SIGNS',
  'SMOOTH OPERATOR','GREAT STOP'];
const msgSignCache={};
function msgSignSprite(msg){
  if(msgSignCache[msg])return msgSignCache[msg];
  const c=makeBmp(48,26,(g)=>{
    g.clearRect(0,0,48,26);
    g.fillStyle='#222';g.fillRect(21,14,6,12); // post
    g.fillStyle='#0a3a0a';g.fillRect(0,0,48,1); // top housing
    g.fillStyle='#1a6b1a';g.fillRect(0,1,48,13); // green board
    g.fillStyle='#0a3a0a';g.fillRect(0,14,48,1); // bottom housing
    g.fillStyle='#fff';g.fillRect(0,1,48,1); g.fillRect(0,13,48,1); // border
    g.fillStyle='#fff';g.font='bold 5px monospace';g.textBaseline='top';
    const words=msg.split(' ');
    // fit two lines
    const mid=Math.ceil(words.length/2);
    const l1=words.slice(0,mid).join(' ');
    const l2=words.slice(mid).join(' ');
    g.fillText(l1.toUpperCase(),2,2);
    if(l2)g.fillText(l2.toUpperCase(),2,8);
  });
  msgSignCache[msg]=c;return c;
}
const sprCurveWarn = makeBmp(18,26,(g)=>{
  g.clearRect(0,0,18,26);
  g.fillStyle='#333';g.fillRect(7,12,4,14);             // post
  g.fillStyle='#ffe14d';                                // diamond
  g.beginPath();g.moveTo(9,0);g.lineTo(18,9);g.lineTo(9,18);g.lineTo(0,9);g.closePath();g.fill();
  g.fillStyle='#000';
  g.beginPath();g.moveTo(9,2);g.lineTo(16,9);g.lineTo(9,16);g.lineTo(2,9);g.closePath();
  g.fillStyle='#ffe14d';
  g.beginPath();g.moveTo(9,3);g.lineTo(15,9);g.lineTo(9,15);g.lineTo(3,9);g.closePath();g.fill();
  g.strokeStyle='#000';g.lineWidth=2;                   // squiggle arrow
  g.beginPath();g.moveTo(12,5);g.quadraticCurveTo(4,8,7,13);g.stroke();
  g.fillStyle='#000';g.fillRect(5,11,5,2);
});
const sprHorn = makeBmp(12,8,(g)=>{g.fillStyle='#ffec00';g.fillRect(0,2,12,4);g.fillStyle='#000';g.fillRect(0,3,12,1);});
function personSprite(shirt,pants,skin){
  return makeBmp(8,16,(g)=>{
    g.clearRect(0,0,8,16);
    g.fillStyle=skin;g.fillRect(2,1,4,4);           // head
    g.fillStyle='#111';g.fillRect(2,1,4,1);          // hair
    g.fillStyle=shirt;g.fillRect(1,6,6,5);           // torso
    g.fillStyle=skin;g.fillRect(0,6,1,4);g.fillRect(7,6,1,4); // arms
    g.fillStyle=pants;g.fillRect(2,11,2,5);g.fillRect(4,11,2,5); // legs
    g.fillStyle='#000';g.fillRect(2,15,2,1);g.fillRect(4,15,2,1);
  });
}
/* personSprite: builds one 8x16 passenger from shirt/pants/skin colors.
   PEOPLE holds 5 variants; stations pick from it (pseudo-)randomly. */
const PEOPLE=[personSprite('#e04040','#2222aa','#ffcc99'),personSprite('#30a030','#333','#8a5a2b'),
  personSprite('#3a7bff','#444','#ffcc99'),personSprite('#ff7bd5','#222','#5a3a1b'),
  personSprite('#ff8c00','#005','#ffe0b0')];
const sprBench = makeBmp(20,8,(g)=>{
  g.fillStyle='#5a3a1a';g.fillRect(0,0,20,3);
  g.fillStyle='#7a522a';g.fillRect(0,0,20,1);
  g.fillStyle='#333';g.fillRect(1,3,2,5);g.fillRect(17,3,2,5);
});
const sprStop = makeBmp(24,20,(g)=>{
  g.fillStyle='#111';g.fillRect(0,0,24,20);
  g.fillStyle='#ffe14d';g.fillRect(0,0,24,3);g.fillRect(0,17,24,3);
  g.fillStyle='#fff';g.font='bold 9px monospace';g.fillText('STOP',1,6);
  g.fillStyle='#f22';g.fillRect(9,14,6,2);
});
/* striped marker post flagging the optimal stop point (planted each side) */
const sprStopPost = makeBmp(6,34,(g)=>{
  g.clearRect(0,0,6,34);
  g.fillStyle='#222';g.fillRect(1,10,4,24);             // pole
  for(let y=10;y<34;y+=4){g.fillStyle=(y/4)%2?'#fff':'#e02020';g.fillRect(1,y,4,3);}
  g.fillStyle='#fff';g.fillRect(0,0,6,10);              // flag board
  g.fillStyle='#000';g.fillRect(0,0,6,1);g.fillRect(0,9,6,1);g.fillRect(0,0,1,10);g.fillRect(5,0,1,10);
  g.fillStyle='#e02020';g.fillRect(1,4,4,2);
});

/* station name board drawn on demand (still a scaled bitmap) */
const boardCache={};
function boardSprite(name){
  if(boardCache[name])return boardCache[name];
  const c=makeBmp(64,12,(g)=>{
    g.fillStyle='#0a1a6e';g.fillRect(0,0,64,12);
    g.fillStyle='#fff';g.fillRect(0,0,64,1);g.fillRect(0,11,64,1);
    g.fillStyle='#fff';g.font='bold 8px monospace';g.textBaseline='top';
    g.fillText(name.slice(0,10).toUpperCase(),3,2);
  });
  boardCache[name]=c;return c;
}

/* ---------- audio: tiny square-wave 16-bit bleeps ---------- */
// WebAudio 101: AudioContext = speaker system. Oscillator = tone generator,
// Gain = volume knob. beep() makes a short tone that fades out.
// Browsers block sound until the user presses something, so audio() is
// called on first key/touch (and resumes if suspended). Mute = skip all.
let AC=null, muted=false, engineOsc=null, engineGain=null;
function audio(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended')AC.resume(); return AC; }
function beep(f,dur,type='square',vol=0.12,slide=0){
  if(muted)return; try{
    const ac=audio(),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+dur);
    g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function chime(){beep(660,0.12);setTimeout(()=>beep(880,0.18),130);setTimeout(()=>beep(1320,0.25),260);}
function horn(){beep(220,0.5,'sawtooth',0.18);beep(277,0.5,'sawtooth',0.18);}
function startEngine(){
  if(muted||engineOsc)return; try{
    const ac=audio();engineOsc=ac.createOscillator();engineGain=ac.createGain();
    engineOsc.type='sawtooth';engineOsc.frequency.value=40;engineGain.gain.value=0.03;
    engineOsc.connect(engineGain);engineGain.connect(ac.destination);engineOsc.start();
  }catch(e){}
}

/* ---------- track / timetable (ENDLESS) ---------- */
// The world is 1-dimensional: everything lives at a "pos" in meters along
// the track. trackPos = where the train front is. Stations/signs/lamps are
// just numbers; rendering converts (objectPos - trackPos) into screen size.
// New stations are generated forever ahead, old ones pruned behind.
const NAMES=['BERGKRYSTALLEN','MUNKELIA','KARLSRUD','LAMBERTSETER','BRATTLIKOLLEN','RYEN','HØYENHALL','MANGLERUD','BRYNSENG','HELSFYR','ENSJØ','LØREN','GRØNLAND','TØYEN','JERNBANETORGET','STORTINGET','NATIONALTHEATRET','MAJORSTUEN','BLINDERN','FORSKNINGSPARKEN','ULLEVÅL STADION','NYDALEN','STORO','SINSEN','RISLØKKA','LINDERUD','VOLLEBEKK','VEITVET','KALBAKKEN','RØDTVET','AMMERUD','GRORUD','ROMSÅS','STOVNER','ROMMEN','VESTLI'];
const STATIONS=[]; // {name,pos,signal:'red'|'green',arrived}
const ST_HALF=110;          // platform half-length (m)
const STOP_OFF=80;          // optimal stop point sits this far past platform centre (far end)
const SIG_PAST=70;          // exit signal sits this far past the stop point
function stopPos(st){return st.pos+STOP_OFF;}
function sigPos(st){return st.pos+STOP_OFF+SIG_PAST;}
function randLeg(){return 900+Math.floor(Math.random()*900);} // 900..1800m random
function pickName(){let n;do{n=NAMES[Math.floor(Math.random()*NAMES.length)];}while(STATIONS.length&&STATIONS[STATIONS.length-1].name===n);return n;}
function pushStation(pos,name){const st={name:name||pickName(),pos,signal:'red',arrived:false};STATIONS.push(st);return st;}
const LAMP_EVERY=60, SLEEPER_EVERY=6;

/* ---------- game state ---------- */
// state machine: 'title' → 'drive' ⇄ 'doors' (done is unused legacy end screen).
// trackPos/speed = physics. throttle/brake = 0..4 notches (chunky arcade feel).
// nextStIdx = which station we are heading for. score/popups = feedback.
// legClean/approachAwarded/emergencyUsed = per-leg bonus flags, reset each leg.
let state='title'; // title | drive | doors | done
let trackPos=0, speed=0;           // m, m/s
let throttle=0, brake=0;           // 0..4 , 0..4
let emergency=false;
let doorsOpen=false, doorTimer=0, boarded=false;
let nextStIdx=0, score=0, stopsDone=0;
let late=0, timeLeft=0, stationBonusMsg='', msgTimer=0;
let shake=0, lookX=0, hornT=0, overSpeedT=0;
let flashT=0, departOk=false;
/* score event feed + hi-score + per-leg driving flags */
// addScore: clamps at 0, saves hi-score to localStorage (survives reload),
// and pushes a floating "+100 GOOD STOP" popup (max 6 on screen).
let hiScore=0; try{hiScore=parseInt(localStorage.getItem('supersubway_hi')||'0')||0;}catch(e){}
const popups=[]; // {txt,t,color}
let legClean=true, approachAwarded=false, emergencyUsed=false, distClean=0;
function addScore(n,label){
  score=Math.max(0,score+n);
  if(score>hiScore){hiScore=score;try{localStorage.setItem('supersubway_hi',String(hiScore));}catch(e){}}
  if(label){popups.push({txt:(n>=0?'+':'')+n+' '+label,t:2.4,color:n>=0?'#0f6':'#f44'});if(popups.length>6)popups.shift();}
}
function resetLegFlags(){legClean=true;approachAwarded=false;emergencyUsed=false;distClean=0;overSpeedT=0;}
const VMAX=45, ST_VMAX=20;
const SPEED_SCALE=2; // world scrolls 2× per m/s — numbers stay, feel doubles
const LIM_KMH_TOP=170;
/* endless speed-limit zones: [{at, vms}] — each zone starts with a trackside sign */
// ensureLimits: keep ~1400m of random limit zones generated ahead of the train
// and drop very old ones (max 48). zoneLimitAt: "last zone at-or-before p wins".
const LIMITS=[];
const SPEEDS=[42,34,27,20,14]; // m/s ≈ 151/122/97/72/50 km/h
function ensureLimits(){
  let lastAt=LIMITS.length?LIMITS[LIMITS.length-1].at:-100;
  while(lastAt<trackPos+1400){
    let at=lastAt+160+Math.floor(Math.random()*200);
    let vms=SPEEDS[Math.floor(Math.random()*SPEEDS.length)];
    // snap to nearby curve start and set 50 km/h
    let prevSh=curveSharp(at-50)<0.09;
    for(let dp=-40;dp<=80;dp+=8){
      const sh=curveSharp(at+dp);
      if(prevSh&&sh>0.11){
        const snap=at+dp-12;
        if(snap>lastAt+60){at=snap;vms=14;}
        break;
      }
      prevSh=sh<0.09;
    }
    lastAt=at;
    LIMITS.push({at:lastAt,vms});
  }
  if(LIMITS.length>80)LIMITS.splice(0,LIMITS.length-80);
}
/* Green motivational signs alongside the track */
const MSGSIGNS=[];
function ensureMsgSigns(){
  let lastAt=MSGSIGNS.length?MSGSIGNS[MSGSIGNS.length-1].at:-40;
  while(lastAt<trackPos+1400){
    lastAt+=180+Math.floor(Math.random()*160);
    const nearLim=LIMITS.some(z=>Math.abs(z.at-lastAt)<70);
    if(!nearLim){
      MSGSIGNS.push({at:lastAt,msg:MSG_QUOTES[Math.floor(Math.random()*MSG_QUOTES.length)]});
    }
  }
  if(MSGSIGNS.length>80)MSGSIGNS.splice(0,MSGSIGNS.length-80);
}
function zoneLimitAt(p){
  let v=LIMITS.length?LIMITS[0].vms:42;
  for(const z of LIMITS){ if(z.at<=p)v=z.vms; else break; }
  return v;
}

// trackCurve: sideways offset of the track at position p (sum of 3 sines =
// gentle + medium + wiggly bends). Everything on screen shifts by the
// difference between the curve ahead and the curve at the camera — that is
// what makes bends appear to swing. curveSharp: how bendy is it HERE
// (sampled ±14m). curveLimitAt: sharper bend → lower safe speed.
// speedLimitAt: the strictest of zone limit, station limit, curve limit.
function trackCurve(p){ return Math.sin(p*0.0046)*40 + Math.sin(p*0.0014)*48 + Math.sin(p*0.011)*9; }
function curveSharp(p){ return Math.abs(trackCurve(p+14)-trackCurve(p-14))/28; }
function curveLimitAt(p){ const sh=curveSharp(p); return Math.max(14, Math.min(45, 45-sh*90)); }
function inStation(p){ for(const s of STATIONS){ if(Math.abs(p-s.pos)<ST_HALF) return s;} return null; }
function speedLimitAt(p){
  let lim=Math.min(zoneLimitAt(p),VMAX);
  const s=inStation(p); if(s && Math.abs(p-s.pos)<130) lim=Math.min(lim,ST_VMAX);
  return Math.min(lim,curveLimitAt(p));
}

/* ---------- input (keyboard + touch) ---------- */
// Pattern: small do*() functions hold the real logic; keyboard handler AND
// touch buttons both call them. That way PWR works identically on ↑, W,
// or the on-screen button. lookX = -1/0/1 shifts the camera sideways.
const keys={};
function doPower(){ if(emergency){emergency=false;} brake=Math.max(0,brake-1); throttle=Math.min(4,throttle+1); beep(300+throttle*90,0.07); }
function doBrake(){ throttle=0; brake=Math.min(4,brake+1); beep(220-brake*20,0.08); }
function toggleEmergency(){ emergency=!emergency; beep(emergency?180:520,0.15); if(emergency){throttle=0;brake=4;emergencyUsed=true;legClean=false;} else brake=0; }
function doHorn(){ horn();hornT=1;beep(440,0.1,'square',0.06); }
function toggleMute(){ muted=!muted; if(engineGain)engineGain.gain.value=muted?0:0.03; const b=document.getElementById('btnMute'); if(b)b.textContent=muted?'🔇':'🔊'; }
function pressStart(){ if(state==='title'||state==='done'){startGame();return true;} return false; }
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.repeat)return; keys[e.key.toLowerCase()]=true;
  audio();startEngine();
  const k=e.key.toLowerCase();
  if(state==='title'&&(k==='enter'||k===' ')){startGame();return;}
  if(state==='done'&&k==='enter'){startGame();return;}
  if(k==='m'){toggleMute(); return;}
  if(k==='h'){doHorn();return;}
  if(k===' '){toggleEmergency(); return;}
  if(k==='d'||k==='e'||k==='o'){tryDoors();return;}
  if(k==='arrowup'||k==='w'){ doPower(); }
  if(k==='arrowdown'||k==='s'){ doBrake(); }
  if(k==='arrowleft'||k==='a')lookX=-1; if(k==='arrowright')lookX=1;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')lookX=0; if(k==='arrowright')lookX=0;
});
/* touch: detect + bind buttons (tap, hold-to-repeat for PWR/BRK) */
// bindTap: fire once per press. bindHold: fire once, then auto-repeat while
// held (like holding a key). pointer* events cover mouse+touch+pen at once.
if(('ontouchstart' in window)||navigator.maxTouchPoints>0){document.body.classList.add('touch');}
function bindTap(id,fn){
  const el=document.getElementById(id); if(!el)return;
  el.addEventListener('pointerdown',e=>{e.preventDefault(); audio();startEngine(); fn();});
}
function bindHold(id,fn){
  const el=document.getElementById(id); if(!el)return;
  let t1=null,t2=null;
  const start=e=>{e.preventDefault(); audio();startEngine(); el.classList.add('held'); fn();
    t1=setTimeout(()=>{t2=setInterval(fn,170);},380);};
  const end=()=>{el.classList.remove('held'); clearTimeout(t1); clearInterval(t2); t1=t2=null;};
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold('btnPwr',doPower);
bindHold('btnBrk',doBrake);
bindTap('btnDoors',()=>{ if(!pressStart())tryDoors(); });
bindTap('btnGo',()=>{ if(!pressStart())tryDoors(); });
bindTap('btnHorn',doHorn);
bindTap('btnEmg',toggleEmergency);
bindTap('btnMute',toggleMute);
(function(){
  const l=document.getElementById('btnLookL'), r=document.getElementById('btnLookR');
  if(l){l.addEventListener('pointerdown',e=>{e.preventDefault();lookX=-1;});l.addEventListener('pointerup',()=>{lookX=0;});l.addEventListener('pointercancel',()=>{lookX=0;});l.addEventListener('pointerleave',()=>{if(lookX<0)lookX=0;});}
  if(r){r.addEventListener('pointerdown',e=>{e.preventDefault();lookX=1;});r.addEventListener('pointerup',()=>{lookX=0;});r.addEventListener('pointercancel',()=>{lookX=0;});r.addEventListener('pointerleave',()=>{if(lookX>0)lookX=0;});}
  // tap screen to start / dismiss title & done screens (also unlocks audio on iOS)
  const scr=document.getElementById('screen');
  if(scr){scr.addEventListener('pointerdown',()=>{audio();startEngine();pressStart();});}
  // keep layout honest on rotate / URL-bar show-hide
  addEventListener('orientationchange',()=>setTimeout(()=>window.scrollTo(0,0),100));
})();
// startGame: reset EVERYTHING for a fresh run (pos, speed, score, stations,
// limits) and switch state to 'drive'. Called from title/done screens.
function startGame(){
  trackPos=0;speed=0;throttle=0;brake=0;emergency=false;
  doorsOpen=false;doorTimer=0;boarded=false;nextStIdx=0;score=0;stopsDone=0;
  late=0;timeLeft=90;departOk=false;stationBonusMsg='';msgTimer=0;
  popups.length=0;resetLegFlags();
  STATIONS.length=0;pushStation(800,pickName());
  LIMITS.length=0;LIMITS.push({at:0,vms:42});ensureLimits();
  MSGSIGNS.length=0;ensureMsgSigns();
  state='drive';chime();
}
// called once boarding is finished: turns THIS station green + lays random track ahead
// Flow: doors close (auto timer OR player presses D) → signal turns green →
// next station generated at random distance → player can depart. auto=true
// means the timer closed them; auto=false means the player closed them early.
function completeBoarding(auto){
  const st=STATIONS[nextStIdx];
  doorsOpen=false;state='drive';departOk=true;
  const base=st?st.pos:trackPos;
  if(st){st.signal='green';st.arrived=true;}
  nextStIdx++;timeLeft+=45;
  // NEW random length to next station, measured from the station just served
  const ahead=randLeg();
  pushStation(base+ahead, undefined);
  resetLegFlags();
  beep(400,0.12);setTimeout(()=>beep(600,0.15),140);
  if(auto){
    stationBonusMsg='DEPART! NEXT: '+STATIONS[nextStIdx].name+' ('+ahead+'m)';
  }else{
    stationBonusMsg='DOORS CLOSED — GREEN! GO!';
  }
  msgTimer=2.5;
}
// tryDoors: the D key / DOORS button. Only works when slow (<0.6 m/s) and
// within 25m of the stop point. First press OPENS (state→'doors', signal→red,
// points for accuracy). Second press (or timer) CLOSES via completeBoarding.
function tryDoors(){
  if(state!=='drive'&&state!=='doors')return;
  const st=STATIONS[nextStIdx];
  const err=st?Math.abs(trackPos-stopPos(st)):9999;
  if(speed>0.6){stationBonusMsg='TOO FAST FOR DOORS!';msgTimer=2;beep(140,0.25);return;}
  if(!st){return;}
  if(err>40){stationBonusMsg='NO PLATFORM HERE!';msgTimer=2;beep(140,0.25);return;}
  if(!doorsOpen){ // open — station reached => exit signal goes RED
    doorsOpen=true;state='doors';doorTimer=6;boarded=false;
    st.signal='red';st.arrived=true;
    beep(520,0.1);setTimeout(()=>beep(780,0.15),120);chime();
    // score stop
    let pts = err<=6?300 : err<=12?200 : 100;
    if(Math.abs(speed)>0.6)pts=0;
    addScore(pts,(err<=6?'PERFECT STOP':'GOOD STOP'));
    stopsDone++;
    if(!emergencyUsed&&brake<=2)addScore(50,'SMOOTH STOP');
    if(legClean)addScore(100,'CLEAN LEG');
    stationBonusMsg=(err<=6?'PERFECT STOP! +':'GOOD STOP! +')+pts+' — RED, BOARDING…';
    msgTimer=3;
  }else{ // close early => boarding done => GREEN + random next leg
    completeBoarding(false);
  }
}

/* ---------- projection (height-aware: 0=floor, CEIL_H=roof) ---------- */
// projectY: the ONLY 3D math in the game. Given an object (worldZoff meters
// ahead, worldX meters sideways, worldY meters up), return screen {x, y, s}.
// s = scale = FOCAL/z: double the distance → half the size (perspective).
// dx subtracts the track bend so curves swing the world sideways.
// shake adds tiny random jitter for speed vibration. Returns null if behind.
// project() = floor-level shortcut (y=0). projectCeil() = roof shortcut.
// drawScaledBmp*: project, then drawImage centered, skipping tiny/far/huge.
function projectY(worldZoff, worldX, worldY, camCurve){
  const z=worldZoff; if(z<2)return null;
  const s=FOCAL/z;
  const dx=trackCurve(trackPos+z)-camCurve;
  const x=W/2+(worldX-dx-lookX*14)*s + (Math.random()-0.5)*shake;
  const y=HORIZON+(CAM_H-worldY)*s + (Math.random()-0.5)*shake;
  return {x,y,s,z};
}
function project(worldZoff, worldX, camCurve){
  return projectY(worldZoff, worldX, 0, camCurve);
}
function projectCeil(worldZoff, worldX, camCurve){
  return projectY(worldZoff, worldX, CEIL_H, camCurve);
}
function drawScaledBmp(img,wx,wzoff,w,h){
  const camC=trackCurve(trackPos);
  const p=project(wzoff,wx,camC); if(!p||p.y<-40||p.y>H)return;
  const dw=w*p.s, dh=h*p.s;
  if(dw<1||dh<1||dw>400)return;
  ctx.drawImage(img,p.x-dw/2,p.y-dh,dw,dh);
}
function drawScaledBmpY(img,wx,wy,wzoff,w,h){
  const camC=trackCurve(trackPos);
  const p=projectY(wzoff,wx,wy,camC); if(!p||p.y<-60||p.y>H)return;
  const dw=w*p.s, dh=h*p.s;
  if(dw<1||dh<1||dw>400)return;
  ctx.drawImage(img,p.x-dw/2,p.y-dh,dw,dh);
}

/* ---------- RENDER ---------- */
// render(dt): draws ONE frame, back-to-front (painter's algorithm):
//   1. sky + vanishing point, 2. ROOF pass (rows above horizon = ceiling),
//   3. FLOOR/WALL pass (rows below horizon = track depth), 4. bore outlines,
//   5. sprites far→near (lamps, signs, stations, signals), 6. cockpit + HUD
//   7. overlays (title/doors/done/messages/popups/flash/scanlines).
// dt = seconds since last frame (unused for drawing speed here, but passed
// to countdown timers). frame++ drives all blinking/bobbing animation.
let frame=0;
function render(dt){
  frame++;
  shake=Math.min(3,speed*0.09+(speed>20?Math.sin(frame*0.7)*0.8:0));
  // curve rumble: sharp bends shake the cab at speed
  {
    const csh=curveSharp(trackPos);
    if(csh>0.13&&speed>9)shake=Math.min(4,shake+csh*speed*0.028);
  }
  const camC=trackCurve(trackPos);
  const stNow=inStation(trackPos);

  // sky / tunnel back
  const bg=ctx.createLinearGradient(0,0,0,HORIZON);
  bg.addColorStop(0,'#05050c');bg.addColorStop(1,'#101024');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,HORIZON+1);

  // distant glow dot (vanishing point)
  const vanishingX=W/2-lookX*8;
  ctx.fillStyle='#2a2a4a';ctx.fillRect(vanishingX-1,HORIZON-2,2,2);
  ctx.fillStyle='#55557a';ctx.fillRect(vanishingX-2,HORIZON-1,4,1);

  /* ---- ROOF pass: rows above horizon = tunnel ceiling ---- */
  // Same trick as floor but mirrored: row y above horizon ↔ depth z on the
  // ceiling. Higher rows = farther. Panels alternate color every 8m so you
  // feel motion; ribs every 20m; lamp glow strips pulse overhead.
  for(let y=ROOF_TOP;y<HORIZON;y++){
    const dy=(HORIZON-y)+0.6;
    const z=((CEIL_H-CAM_H)*FOCAL)/dy;   // world depth of this ceiling row
    if(z>620){ctx.fillStyle='#05050c';ctx.fillRect(0,y,W,1);continue;}
    const wz=trackPos+z;
    const s=FOCAL/z;
    const halfTun=TUN_HALF*s;
    const cx=W/2-((trackCurve(wz)-camC))*s-lookX*8*(1-z/600);
    const inSt=inStation(wz);
    let ceil=((Math.floor(wz/8)%2)===0)?'#101018':'#151522';
    if(inSt) ceil=((Math.floor(wz/6)%2)===0)?'#1b1b28':'#20202f';
    ctx.fillStyle=ceil;ctx.fillRect(0,y,W,1);
    // ribs run over the roof too (tunnel segments every 20m)
    if(Math.floor(wz)%20<1){ctx.fillStyle='#2e2e4e';ctx.fillRect(0,y,W,1);}
    // darken outside the bore
    ctx.fillStyle='rgba(0,0,0,0.62)';
    const wl=cx-halfTun, wr=cx+halfTun;
    if(wl>0)ctx.fillRect(0,y,wl,1);
    if(wr<W)ctx.fillRect(wr,y,W-wr,1);
    // roof lamp glow strip: warm pool baked into ceiling panels
    if(Math.floor(wz)%LAMP_EVERY<4){
      ctx.fillStyle='rgba(255,207,77,0.32)';
      const gw=Math.max(1,9*s);
      ctx.fillRect(cx-gw,y,gw*2,1);
    }
    // cable tray down the roof centre
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(cx-1,y,2,1);
  }

  /* ---- FLOOR/WALL pass: each screen row below horizon = one depth ---- */
  // Core pseudo-3D: screen row y ↔ world depth z = CAM_H*FOCAL/(y-HORIZON).
  // Low rows (bottom) = close = wide track; rows near horizon = far = narrow.
  // cx shifts each row by the track bend → curves. Then per row we paint:
  // walls, tunnel mouth darkening, platforms, track bed, sleepers, rails,
  // stop lines, limit lines, lamp pools. One fillRect per row = fast.
  for(let y=HORIZON;y<H-COCKPIT_H;y++){
    const dy=(y-HORIZON)+0.6;
    const z=(CAM_H*FOCAL)/dy;             // world depth of this row
    const wz=trackPos+z;
    const s=FOCAL/z;
    const halfRoad=14*s, halfTun=TUN_HALF*s; // road half-width, tunnel half-width (px)
    const cx=W/2-((trackCurve(wz)-camC))*s-lookX*8*(1-z/600);
    // tunnel walls (brick courses scroll past)
    const inSt = inStation(wz);
    let wall = ((Math.floor(wz/8)%2)===0)?PAL.tunnel0:PAL.tunnel1;
    if(inSt) wall = ((Math.floor(wz/6)%2)===0)?'#23232e':'#282836';
    ctx.fillStyle=wall;
    ctx.fillRect(0,y,W,1);
    // brick-course shading on the walls (inside the bore only)
    const wl0=cx-halfTun, wr0=cx+halfTun;
    const course=(Math.floor(wz/4)%2)===0;
    ctx.fillStyle=course?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.18)';
    ctx.fillRect(Math.max(0,wl0),y,Math.max(0,cx-halfRoad-16*s-Math.max(0,wl0)),1);
    ctx.fillRect(Math.min(W,cx+halfRoad+16*s),y,Math.max(0,Math.min(W,wr0)-Math.min(W,cx+halfRoad+16*s)),1);
    // wall edge highlight (tunnel ribs every 20m)
    if(Math.floor(wz)%20<1){ctx.fillStyle='#33335a';ctx.fillRect(0,y,W,1);}
    // darken outside tunnel mouth
    ctx.fillStyle='rgba(0,0,0,0.55)';
    const wl=cx-halfTun, wr=cx+halfTun;
    if(wl>0)ctx.fillRect(0,y,wl,1);
    if(wr<W)ctx.fillRect(wr,y,W-wr,1);
    // platform floor in stations
    if(inSt){
      ctx.fillStyle=((Math.floor(wz/4)%2)===0)?PAL.plat:'#545464';
      const pl=cx-halfTun, pr=cx+halfTun;
      const tl=cx-halfRoad-34*s, tr=cx+halfRoad+34*s;
      if(tl>0)ctx.fillRect(Math.max(0,pl),y,Math.max(0,tl-Math.max(0,pl)),1);
      if(tr<W)ctx.fillRect(tr,y,Math.max(0,Math.min(W,pr)-tr),1);
      // yellow platform edge
      ctx.fillStyle=PAL.platEdge;
      if(tl-2>0&&tl<W)ctx.fillRect(tl-2,y,Math.max(1,3*s),1);
      if(tr>0&&tr<W)ctx.fillRect(tr,y,Math.max(1,3*s),1);
    }
    // floor / track bed
    const bedW=halfRoad+16*s;
    ctx.fillStyle=((Math.floor(wz/2)%2)===0)?PAL.floor:'#20202a';
    ctx.fillRect(cx-bedW,y,bedW*2,1);
    // sleepers (scaling bands)
    if(Math.floor(wz)%SLEEPER_EVERY<1.2){
      ctx.fillStyle=(Math.floor(wz/SLEEPER_EVERY)%2)?PAL.sleeper:PAL.sleeper2;
      ctx.fillRect(cx-halfRoad,y,halfRoad*2,1);
    }
    // center third-rail glow / side rails
    const railW=Math.max(1,1.4*s);
    ctx.fillStyle=PAL.rail;
    ctx.fillRect(cx-halfRoad,y,railW,1);
    ctx.fillRect(cx+halfRoad-railW,y,railW,1);
    ctx.fillStyle=PAL.railHi;
    ctx.fillRect(cx-halfRoad,y,1,1);
    // optimal-stop white line: painted across the track at the exact stop point
    for(const stp of STATIONS){
      if(Math.abs(wz-(stp.pos+STOP_OFF))<0.9){
        ctx.fillStyle='rgba(255,255,255,0.35)';
        ctx.fillRect(cx-halfRoad-7*s,y,halfRoad*2+14*s,1);
        ctx.fillStyle='#f4f6ff';
        ctx.fillRect(cx-halfRoad-2*s,y,halfRoad*2+4*s,1);
        break;
      }
    }
    // speed-zone boundary: yellow line where the new limit STARTS (sign stands here)
    for(const z of LIMITS){
      if(Math.abs(wz-z.at)<0.9){
        ctx.fillStyle='rgba(255,225,77,0.35)';
        ctx.fillRect(cx-halfRoad-7*s,y,halfRoad*2+14*s,1);
        ctx.fillStyle='#ffe14d';
        ctx.fillRect(cx-halfRoad-2*s,y,halfRoad*2+4*s,1);
        break;
      }
    }
    // faint warm pool on the track bed under each roof lamp
    if(Math.floor(wz)%LAMP_EVERY<3){ctx.fillStyle='rgba(255,207,77,0.16)';ctx.fillRect(cx-2*s,y,4*s,1);}
  }

  /* ---- tunnel bore outlines: wall/ceiling edges converging ---- */
  // Draws 4 converging lines (left/right wall base + left/right roof edge)
  // by projecting points at increasing z and connecting them. Cheap "3D wire".
  (function(){
    function strokeSide(worldY,side){
      ctx.beginPath();let started=false;
      for(let z=8;z<520;z+=10){
        const s=FOCAL/z, wz=trackPos+z;
        const cx=W/2-((trackCurve(wz)-camC))*s-lookX*8*(1-z/600);
        const x=cx+side*TUN_HALF*s, y=HORIZON+(CAM_H-worldY)*s;
        if(y<ROOF_TOP-4||y>H-COCKPIT_H)continue;
        if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(0,0,0,0.8)';
    strokeSide(0,-1);strokeSide(0,1);strokeSide(CEIL_H,-1);strokeSide(CEIL_H,1);
    ctx.strokeStyle='rgba(120,120,170,0.35)';
    strokeSide(0,-1);strokeSide(0,1);
  })();

  /* sprites back-to-front (scaling bitmaps!) */
  // IMPORTANT ORDER: draw far objects FIRST so near ones overlap them.
  // Lamps loop runs far→near (wz decreasing). Stations skip if off-screen
  // (off<-160 or >560) for speed. People bob with sin(frame…); signals show
  // red until boarded, green after (st.signal), with a pulsing glow.
  const camCurve=camC;
  // ROOF lamps: fixtures bolted to the tunnel ceiling, receding to horizon
  const firstLamp=Math.ceil((trackPos+10)/LAMP_EVERY)*LAMP_EVERY;
  for(let wz=firstLamp+LAMP_EVERY*6; wz>trackPos+8; wz-=LAMP_EVERY){
    const off=wz-trackPos;
    if(off>520)continue;
    const pc=projectCeil(off,0,camCurve); if(!pc)continue;
    drawScaledBmpY(sprLamp,0,CEIL_H,off,24,10);
    // halo around the roof fixture
    if(pc.s>0.15){ctx.fillStyle='rgba(255,220,120,0.13)';ctx.beginPath();
      ctx.ellipse(pc.x,pc.y+2*pc.s,15*pc.s,5*pc.s,0,0,7);ctx.fill();}
    // light pool down on the track bed
    const pf=project(off,0,camCurve);
    if(pf&&pf.s>0.3){ctx.fillStyle='rgba(255,220,120,0.10)';ctx.beginPath();
      ctx.ellipse(pf.x,pf.y,20*pf.s,4*pf.s,0,0,7);ctx.fill();}
  }
  // max-speed signs at every zone start + warning diamond before sharp bends
  {
    for(const z of LIMITS){
      const off=z.at-trackPos;
      if(off<-20||off>520)continue;
      drawScaledBmp(speedSignSprite(Math.round(z.vms*3.6)),-42,off,26,28);
    }
    let warn=-1;
    {
      let prevSh=curveSharp(trackPos+20)<0.09;
      for(let zz=30;zz<500;zz+=12){
        const sh=curveSharp(trackPos+zz);
        if(prevSh&&sh>0.11){warn=Math.max(0,zz-12);break;}
        prevSh=sh<0.09;
      }
    }
    if(warn>0)drawScaledBmp(sprCurveWarn,42,warn,18,26);
    // green motivational signs on the right wall
    for(const ms of MSGSIGNS){
      const off=ms.at-trackPos;
      if(off<-20||off>520)continue;
      drawScaledBmp(msgSignSprite(ms.msg),38,off,48,26);
    }
  }
  // stations: pillars, benches, people, boards, STOP marker
  for(const st of STATIONS){
    const off=st.pos-trackPos;
    const offStop=stopPos(st)-trackPos;
    if(off<-160||off>560)continue;
    const board=boardSprite(st.name);
    for(let d=-90;d<=90;d+=18){
      const o=off+d; if(o<6||o>540)continue;
      drawScaledBmp(boardCache[st.name]?board:board, -62, o, 64,12);
      // pillars both sides
      const pc=trackCurve(trackPos);
      const pl=project(o,-58,pc), pr=project(o,58,pc);
      if(pl&&pl.s>0.15){
        const pw=6*pl.s, ph=40*pl.s;
        ctx.fillStyle='#101018';ctx.fillRect(pl.x-pw/2-1,pl.y-ph-2,pw+2,ph+2);
        ctx.fillStyle=(Math.floor((trackPos+o)/18)%2)?PAL.pillarG:PAL.pillarR;
        ctx.fillRect(pl.x-pw/2,pl.y-ph,pw,ph);
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(pl.x-pw/2,pl.y-ph,1,ph);
      }
      if(pr&&pr.s>0.15){
        const pw=6*pr.s, ph=40*pr.s;
        ctx.fillStyle='#101018';ctx.fillRect(pr.x-pw/2-1,pr.y-ph-2,pw+2,ph+2);
        ctx.fillStyle=(Math.floor((trackPos+o)/18)%2)?PAL.pillarR:PAL.pillarG;
        ctx.fillRect(pr.x-pw/2,pr.y-ph,pw,ph);
      }
    }
    // people + benches (deterministic pseudo-random per station)
    for(let i=0;i<10;i++){
      const px=(i%2?1:-1)*(44+((i*13)%10));
      const pz=off-80+i*17;
      if(pz<8||pz>500)continue;
      const bob=Math.sin(frame*0.15+i*2)*1.5*project(pz,px,camCurve)?.s || 0;
      const p=project(pz,px,camCurve); if(!p)continue;
      const per=PEOPLE[(i+st.pos)%PEOPLE.length];
      const dw=8*p.s,dh=16*p.s;
      if(dw>0.5&&dh>0.5)ctx.drawImage(per,p.x-dw/2,p.y-dh+bob,dw,dh);
      if(i%3===0)drawScaledBmp(sprBench,px+8,pz,20,8);
    }
    // STOP marker at exact stop point (far end of platform) + striped posts
    drawScaledBmp(sprStop,30,offStop,24,20);
    drawScaledBmp(sprStopPost,-32,offStop,6,34);
    drawScaledBmp(sprStopPost,32,offStop,6,34);
    // EXIT SIGNAL at end of platform: open tunnel, red until boarded, then green.
    // (Deliberately NO wall here — the bore stays open past the signal.)
    {
      const sigOff=sigPos(st)-trackPos;
      if(sigOff>6&&sigOff<540){
        const beam=projectCeil(sigOff,0,camCurve);
        if(beam&&beam.y>ROOF_TOP-10){
          const bw=TUN_HALF*beam.s;
          const bt=Math.max(1,3*beam.s);
          // gantry beam across the bore at roof height
          ctx.fillStyle='#08080e';
          ctx.fillRect(beam.x-bw-2,beam.y-bt-1,(bw+2)*2,bt+2);
          ctx.fillStyle='#3d3d5c';
          ctx.fillRect(beam.x-bw,beam.y-bt,bw*2,bt);
          ctx.fillStyle='#77779a';
          ctx.fillRect(beam.x-bw,beam.y-bt,bw*2,1);
          // dropper + signal head hanging right of centre
          const green=st.signal==='green';
          const hb=projectY(sigOff,30,CEIL_H-16,camCurve);
          if(hb){
            const dw2=3*hb.s;
            ctx.fillStyle='#08080e';
            ctx.fillRect(hb.x-dw2/2,beam.y,dw2,Math.max(1,hb.y-14*hb.s-beam.y));
            const img=green?sprExitG:sprExitR;
            const sw=12*hb.s, sh=20*hb.s;
            if(sw>1&&sh>1)ctx.drawImage(img,hb.x-sw/2,hb.y-sh,sw,sh);
            // far-visible glow dot
            const pulse=green?(0.7+0.3*Math.sin(frame*0.2)):(0.7+0.3*Math.sin(frame*0.35));
            ctx.fillStyle=green?`rgba(40,255,120,${0.5*pulse})`:`rgba(255,40,40,${0.55*pulse})`;
            ctx.beginPath();ctx.ellipse(hb.x,hb.y-14*hb.s,7*hb.s,7*hb.s,0,0,7);ctx.fill();
            ctx.fillStyle=green?'#8fffb0':'#ff6060';
            ctx.fillRect(hb.x-1,hb.y-15*hb.s,2,2);
          }
        }
      }
    }
  }

  // horn visual handled by drawHornWaves()
  drawHornWaves(vanishingX);

  /* ---------- cockpit dashboard (bottom bitmap HUD) ---------- */
  // drawCockpit: the bottom panel — speed number + bar, LIM plaque, PWR/BRK
  // notch blocks (4 each), door lamp, countdown clock, score, next-station
  // name + distance bar. All plain fillRect/fillText, no images.
  drawCockpit(dt, stNow);

  /* ---------- text HUD ---------- */
  // drawHUD: floating text over the 3D view — top score bar, signal repeater
  // (mini GO/STOP mirror), station banner, meters-to-stop countdown,
  // door prompt, SLOW DOWN / SHARP CURVE warnings.
  drawHUD(stNow);

  if(state==='title')drawTitle();
  if(state==='done')drawDone();
  if(state==='doors')drawDoorsOverlay();
  if(msgTimer>0){msgTimer-=dt;
    ctx.font='bold 8px monospace';ctx.textAlign='center';
    ctx.fillStyle='#000';ctx.fillText(stationBonusMsg,W/2+1,HORIZON+22);
    ctx.fillStyle='#ffe14d';ctx.fillText(stationBonusMsg,W/2,HORIZON+21);
  }
  // score event popups (rise + fade, green gains / red deductions)
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.t-=dt;
    if(pp.t<=0){popups.splice(i,1);continue;}
    const rise=(2.4-pp.t)*8;
    ctx.globalAlpha=Math.min(1,pp.t*2);
    ctx.font='bold 8px monospace';ctx.textAlign='right';
    ctx.fillStyle='#000';ctx.fillText(pp.txt,W-7+1,HORIZON+44+i*10-rise+1);
    ctx.fillStyle=pp.color;ctx.fillText(pp.txt,W-7,HORIZON+44+i*10-rise);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
  // overspeed flash
  if(flashT>0){flashT-=dt;
    ctx.fillStyle=`rgba(255,0,0,${0.12+0.1*Math.sin(frame*0.5)})`;
    ctx.fillRect(0,0,W,H);
  }
}
function drawHornWaves(vx){
  if(hornT<=0)return;
  ctx.strokeStyle='#ffec00';ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    const r=(frame*3+i*8)%30;
    ctx.globalAlpha=Math.max(0,1-r/30);
    ctx.beginPath();ctx.arc(vx,HORIZON-6,6+r,Math.PI*1.2,Math.PI*1.8);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------- UPDATE ---------- */
// update(now): physics + rules, then render(). requestAnimationFrame gives us
// `now` (ms timestamp); dt clamps to 0.05s so tab-switch lag can't teleport.
// accel: throttle pushes (+1.4/notch), brakes pull (-2/notch), emergency
// slams (-6). Drag and rolling friction only apply when braking or emergency —
// at zero throttle with no brakes the train coasts at constant speed.
// Then: move (trackPos += speed*dt), limits, overspeed fines, clean-run
// trickle bonus, approach bonus, missed-station penalty, door timer,
// engine hum pitch. Doors state freezes the train (speed=0).
let last=performance.now();
function update(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='drive'||state==='doors'){
    // physics: 16-bit chunky notches
    const decelerating = brake>0 || emergency;
    const drag = decelerating ? (speed*0.055 + (speed>0?0.25:0)) : 0;
    const accel = throttle*1.4 - brake*2.0 - (emergency?6:0) - drag;
    if(state==='doors'){speed=0;}
    else{
      speed+=accel*dt;
      if(speed<0)speed=0;
      if(speed>VMAX+5)speed=VMAX+5;
      trackPos+=speed*dt*SPEED_SCALE;
      ensureLimits(); ensureMsgSigns();
      // prune long-served stations behind us (keeps loops cheap; index follows)
      while(STATIONS.length&&STATIONS[0].pos<trackPos-400&&nextStIdx>0){STATIONS.shift();nextStIdx--;}
      // overspeed: escalating deduction + alarm while over the limit
      const lim=speedLimitAt(trackPos);
      if(speed>lim+0.5){
        overSpeedT+=dt;flashT=0.2;legClean=false;
        if(Math.floor(now/300)!==Math.floor((now-dt*1000)/300))beep(880,0.06,'square',0.08);
        if(overSpeedT>0.6){
          const over=speed-lim;
          addScore(-(Math.ceil(over*1.5)+1),'SPEEDING!');
          beep(160,0.2,'sawtooth',0.14);
          overSpeedT=0;
        }
      } else {
        overSpeedT=0;
        // good driving: clean distance trickle while rolling under the limit
        if(speed>4){
          distClean+=speed*dt;
          if(distClean>=120){distClean-=120;addScore(8,'CLEAN RUN');beep(990,0.06,'square',0.05);}
        }
      }
      // rail screech when overcooking a sharp bend
      if(curveSharp(trackPos)>0.16&&speed>curveLimitAt(trackPos)){
        if(Math.random()<dt*6)beep(1400+Math.random()*800,0.08,'sawtooth',0.04);
      }
      // good driving: tidy approach to the next station
      {
        const ns=STATIONS[nextStIdx];
        if(ns&&!approachAwarded){
          const d=stopPos(ns)-trackPos;
          if(d<170&&d>25&&speed<=lim){approachAwarded=true;addScore(25,'NICE APPROACH');beep(740,0.1,'square',0.07);}
        }
      }
      // timetable pressure
      timeLeft-=dt;
      if(timeLeft<0){timeLeft=0;}
      // missed station? lay a fresh random leg ahead (endless running)
      const st=STATIONS[nextStIdx];
      if(st&&trackPos-stopPos(st)>30){
        stationBonusMsg='MISSED '+st.name+'! (-100)';msgTimer=3;addScore(-100,'MISSED STATION');
        beep(120,0.4);st.signal='green';
        nextStIdx++;timeLeft+=40;departOk=false;resetLegFlags();
        pushStation(trackPos+randLeg(), undefined);
      }
    }
    if(state==='doors'){
      doorTimer-=dt;
      if(Math.random()<dt*8)beep(900+Math.random()*600,0.03,'square',0.03);
      if(doorTimer<=0){ // auto close => boarded => GREEN + new random leg
        completeBoarding(true);
      }
    }
    if(engineOsc&&!muted){
      engineOsc.frequency.value=35+speed*6+throttle*8;
      engineGain.gain.value=0.02+speed*0.001+throttle*0.008;
    }
    if(hornT>0)hornT-=dt;
  }
  render(dt);
  requestAnimationFrame(update);
}
function finishRun(){state='done';beep(523,0.15);setTimeout(()=>beep(659,0.15),160);setTimeout(()=>beep(784,0.3),320);}

/* idle attract: slow roll on title */
// Title-screen eye candy: creep the camera forward so the tunnel scrolls
// behind the title. Wraps at 700m. The real loop starts below: seed `last`,
// then every frame runs update→render→next frame, forever.
setInterval(()=>{ if(state==='title'){trackPos+=2; if(trackPos>700)trackPos=0;} },50);
requestAnimationFrame((t)=>{last=t;requestAnimationFrame(update);});
</script>
