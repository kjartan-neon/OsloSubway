# Deploy the multi-file static site to GitHub Pages.
# ----------------------------------------------------------------------------
# JUNIOR GLOSSARY (GitHub Actions in 30 seconds):
#   workflow    → a recipe file (THIS file) that GitHub runs automatically.
#   on: push / workflow_dispatch → WHEN it runs: every push to "main", plus a
#                 manual "Run workflow" button in the GitHub web UI.
#   jobs        → the recipe's chapters. "validate" checks the site; "deploy"
#                 publishes it. needs: validate = "don't publish a broken site".
#   runs-on     → which computer GitHub borrows (ubuntu-latest = free Linux).
#   steps       → the chapter's individual commands, run top-to-bottom.
#   uses: actions/... → a pre-made helper (checkout = download our code).
#   run: ...   → our own shell commands (the | form runs MULTIPLE lines).
# Site layout (all paths RELATIVE so project Pages /OsloSubway/ works):
#   index.html        → page shell, loads ./css/style.css + ./js/main.js
#   css/style.css     → arcade cabinet look, touch buttons
#   js/*.js           → ES modules (config, sprites, audio, world, state,
#                       input, render, update, main). No build step.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # validate: prove the site is complete + wired BEFORE publishing anything.
  # Three checks: (1) every file exists, (2) every JS module parses with
  # `node --check` (catches typos WITHOUT running the game), (3) index.html
  # actually references ./css/style.css + ./js/main.js as a module (catches
  # broken <link>/<script> tags). Any failure (exit 1) stops the deploy.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files exist
        run: |
          test -f index.html || (echo "missing index.html" && exit 1)
          test -f css/style.css || (echo "missing css/style.css" && exit 1)
          for f in config sprites audio world state input render update main; do
            test -f "js/$f.js" || (echo "missing js/$f.js" && exit 1)
          done
          ls -R .

      - name: Syntax-check JS modules (no build step)
        run: |
          for f in js/*.js; do echo "checking $f"; node --check "$f" || exit 1; done

      - name: Check asset wiring (relative paths for project Pages)
        run: |
          grep -q 'href="./css/style.css"' index.html
          grep -q 'src="./js/main.js"' index.html
          grep -q 'type="module"' index.html
          echo "wiring OK"

  # deploy: publish to GitHub Pages (runs ONLY if validate passed).
  # Checkout → Setup Pages → Upload artifact (path '.' = index.html + css/ +
  # js/ TOGETHER; extra files like LICENSE are harmless) → Deploy. The
  # environment url prints the live site link when done.
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root: index.html + css/ + js/ deploy together.
          # .github/ and LICENSE are harmless extra files in the artifact.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
